<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>漫频 Aether · 3408×2272 设计预览</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0e}body{display:grid;place-items:center}.device{position:relative;overflow:hidden;flex:none}iframe{display:block;width:1704px;height:1136px;border:0;transform-origin:top left}
</style></head><body><div class="device"></div><script>
const device=document.querySelector('.device'),frames=new Map();
function fit(){const scale=Math.min(innerWidth/1704,innerHeight/1136);device.style.width=1704*scale+'px';device.style.height=1136*scale+'px';for(const frame of frames.values())frame.style.transform='scale('+scale+')'}
function show(page){page=page==='modern'?'modern':'immersive';for(const frame of frames.values())frame.style.display='none';let frame=frames.get(page);if(!frame){frame=document.createElement('iframe');frame.title='漫频 Aether '+(page==='modern'?'现代主页面':'纯沉浸页面')+'，3408×2272 设备比例';frame.src=page==='modern'?'/modern/index.html':'/index.html';device.append(frame);frames.set(page,frame)}frame.style.display='block';document.title='漫频 Aether · '+(page==='modern'?'现代主页面':'沉浸页')+'预览';fit()}
window.addEventListener('message',event=>{if(event.origin!==location.origin||![...frames.values()].some(frame=>frame.contentWindow===event.source)||event.data?.type!=='aether-preview-page')return;const page=event.data.page==='modern'?'modern':'immersive';history.pushState(null,'','/preview.html?page='+page);show(page)});
window.addEventListener('popstate',()=>show(new URLSearchParams(location.search).get('page')));
new ResizeObserver(fit).observe(document.body);show(new URLSearchParams(location.search).get('page'));
</script></body></html>
