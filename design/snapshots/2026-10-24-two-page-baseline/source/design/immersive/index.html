<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>漫频 Aether · 纯沉浸</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="scene" aria-label="漫频 Aether 纯沉浸视觉样机，信息均为模拟，尚未连接电台">
    <figure class="record" aria-label="淡金月牙与荧光蓝回声细弧的漫频艺术 CD">
      <canvas class="record__surface" id="record" aria-hidden="true"></canvas>
      <p class="record__inscription"><span>AETHER / 漫频</span><span id="disc-edition">PHASE 01 · FREQUENCY</span></p>
    </figure>

    <aside class="information" aria-label="播放信息">
      <section class="station-selector" aria-label="电台切换组件，上下滑动切台，左右滑动切换视图">
        <div class="station-selector__disc">
          <canvas id="selector-record" aria-hidden="true"></canvas>
          <div class="station-selector__controls">
            <button class="station-step station-step--previous" aria-label="上一电台"><i aria-hidden="true"></i></button>
            <button class="station-step station-step--next" aria-label="下一电台"><i aria-hidden="true"></i></button>
          </div>
        </div>
        <div class="station-selector__copy" aria-live="polite">
          <span class="station-selector__index" id="station-position">01 / 04</span>
          <p id="station-name">FM 802</p>
          <span id="station-subtitle">OSAKA / JAPAN</span>
        </div>
        <div class="station-selector__registration" aria-hidden="true">▪▪</div>
      </section>

      <section class="signal-note paper" aria-label="电台文字与印刷图形">
        <div class="signal-note__heading"><span class="signal-note__live"><i aria-hidden="true"></i>ON AIR / MOCK</span><span class="signal-note__serial" id="station-serial">001</span></div>
        <p class="signal-note__statement" id="programme">NIGHT
WINDOWS</p>
        <p class="signal-note__translation" id="programme-description">夜间漫游 · Alternative / Electronic</p>
        <p class="signal-note__track" id="now-playing">Haru Aoki — Last Train Home</p>
        <div class="signal-note__metadata"><span>STREAM<b id="stream-quality">128 kbps · AAC</b></span><span>LOCAL TIME<b id="station-time">22:14 JST</b></span></div>
        <div class="registration" aria-hidden="true"><i></i><i></i><span></span><i></i><i></i></div>
        <div class="print-key" aria-hidden="true"><span></span><b></b><i></i><em></em></div>
        <div class="print-plot" id="print-plot" role="img" aria-label="参考原图的抽象印刷曲线，仅作视觉装饰，非实时音频数据"></div>
        <div class="signal-note__footer"><span>不设边界，漫游频率。</span><span>AETHER — 025</span></div>
      </section>
    </aside>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
